name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint & Deterministic Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov -r requirements.txt

      - name: Run Flake8 Code Linter
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Pytest with Isolated Mocks
        env:
          MISTRAL_API_KEY: "mock_ci_key"
          DATABASE_URL: "sqlite:///:memory:"
          CHROMA_PERSIST_DIR: "/tmp/chroma_test"
        run: |
          pytest --cov=app tests/ --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint & Vitest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Node Modules
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Execute Vitest
        run: npm run test:run
